name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: [enhancement, needs-review]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Feature Request

        Have an idea to make this project better? We'd love to hear it!

        **Before requesting:** Please check if a similar feature has been requested in [Discussions](https://github.com/malys/EVABRPUploader/discussions).

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-submission checks"
      description: "Ensure you've done these before submitting"
      options:
        - label: I've checked existing issues/discussions and found no duplicate
          required: true
        - label: This feature aligns with project scope (real-time ABRP metrics / vehicle telemetry)
          required: true
        - label: I understand this project is not affiliated with SAIC/MG Motor or ABRP
          required: false

  - type: input
    id: title
    attributes:
      label: "Feature Title"
      description: "Clear, concise name for the feature"
      placeholder: "Add battery health tracking to ABRP upload"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case"
      description: |
        What problem does this solve? Why is it needed?
        - Current limitation
        - User need
        - How this improves the project
      placeholder: |
        ABRP shows energy efficiency but not battery degradation over time.
        Users cannot track long-term SOH (state of health) trends.
        Adding battery health metrics would help drivers monitor battery condition.
      rows: 5
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: |
        How should this feature work?
        - Data source (vehicle property?)
        - ABRP API integration
        - Integration points
      placeholder: |
        1. Read battery health metrics via CarPropertyManager
        2. Include SOH, cycle count in ABRP payload
        3. Upload to ABRP API as extended metric
        4. Display trend in ABRP web dashboard
      rows: 6
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Approaches"
      description: "Have you considered other ways to solve this?"
      placeholder: |
        - Alternative 1: Use EVProfile plugin to fetch health data
        - Pro: Centralized vehicle state
        - Con: adds dependency, increases APK size
      rows: 4

  - type: dropdown
    id: complexity
    attributes:
      label: "Estimated Complexity"
      description: "How much work is this?"
      options:
        - "Small (< 1 day)"
        - "Medium (1–3 days)"
        - "Large (1–2 weeks)"
        - "Unknown"
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: "Impact Assessment"
      description: "Does this feature have side effects?"
      options:
        - label: "No — read-only data display / new metrics only"
        - label: "Yes — affects upload frequency / battery drain / data privacy"
        - label: "Unknown — needs investigation"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "How will we know this feature is done?"
      placeholder: |
        - [ ] Battery health metrics collected via CarPropertyManager
        - [ ] Metrics transmitted to ABRP API (with consent)
        - [ ] Upload frequency configurable (to control battery impact)
        - [ ] Tests verify data format matches ABRP schema
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this project is not affiliated with SAIC/MG Motor or ABRP and carries no warranty (see DISCLAIMER.md)
          required: true
